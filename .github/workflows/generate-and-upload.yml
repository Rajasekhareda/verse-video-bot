name: Generate and Upload Verse Video

on:
  workflow_dispatch:
    inputs:
      background_theme:
        description: "Cinematic Background Theme"
        required: true
        type: choice
        options:
          - Random
          - Mountains
          - Ocean
          - Waterfall
          - Forest
          - Desert
          - Sky
          - Celestial
        default: Random
      background_mode:
        description: "Background Source Mode"
        required: true
        type: choice
        options: [auto, image, video, celestial, gradient]
        default: auto
      video_format:
        description: "Video Aspect Ratio"
        required: true
        type: choice
        options: [landscape, shorts]
        default: landscape
      enable_tts:
        description: "Enable Automatic Voice-Over (Telugu + English)?"
        required: true
        type: choice
        options: [Yes, No]
        default: Yes
      telugu_voice:
        description: "Telugu Voice Model"
        required: true
        type: choice
        options:
          - te-IN-ShrutiNeural
          - te-IN-MohanNeural
        default: te-IN-ShrutiNeural
      privacy:
        description: "YouTube Privacy Status"
        required: true
        type: choice
        options: [private, unlisted, public]
        default: private
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (ffmpeg + Unicode/Telugu fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the video generator
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PRIVACY_STATUS: ${{ inputs.privacy || 'private' }}
          BACKGROUND_MODE: ${{ inputs.background_mode || 'auto' }}
          BACKGROUND_THEME: ${{ inputs.background_theme || 'Random' }}
          VIDEO_FORMAT: ${{ inputs.video_format || 'landscape' }}
          ENABLE_TTS: ${{ inputs.enable_tts || 'Yes' }}
          VOICE_TELUGU: ${{ inputs.telugu_voice || 'te-IN-ShrutiNeural' }}
        run: python generate_video_pro.py

      - name: Upload output as workflow artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verse-video-output
          path: output/
          retention-days: 7
